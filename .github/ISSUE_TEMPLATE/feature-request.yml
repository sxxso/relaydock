name: Feature / 功能建议
description: 说明实际使用问题、收益和功能边界
title: "[Feature]: "
body:
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我确认不上传真实账号数据、凭据、环境文件或数据库。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 说明使用场景和现在的操作成本，不只是列一个功能名称。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案与验收标准
      description: 如涉及筛选或整理，请保持只操作已有数据、不自动查询的边界。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可选替代方案
